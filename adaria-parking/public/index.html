<!DOCTYPE html>
<html lang="es">
<head><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🅿️</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Adaria Vera · Parking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div>
    <h1>Hotel Adaria Vera · Parking</h1>
    <div class="sub">Tablero de plazas en tiempo real</div>
    <div style="font-size: 0.85rem; opacity: 0.9; margin-top: 4px;" id="adaria-header-version"></div>
  </div>
  <div class="top-actions">
    <span id="user-label" style="font-size:.85rem;opacity:.85;"></span>
    <div class="tarifa-chip">
      <span id="tarifa-texto">Tarifa: 10 €/día</span>
      <button id="btn-editar-tarifa">editar</button>
    </div>
    <button id="btn-admin" style="display:none;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;">Admin</button>
    <button id="btn-logout" title="Cerrar sesión" style="background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;">Salir</button>
  </div>
</header>

<main>
  <div class="resumen">
    <div class="tarjeta libres">
      <div class="num" id="num-libres">-</div>
      <div class="label">Libres</div>
    </div>
    <div class="tarjeta ocupadas">
      <div class="num" id="num-ocupadas">-</div>
      <div class="label">Ocupadas</div>
    </div>
    <div class="tarjeta">
      <div class="num" id="num-bloqueadas">-</div>
      <div class="label">Bloqueadas</div>
    </div>
    <div class="tarjeta">
      <div class="num" id="num-total">61</div>
      <div class="label">Total plazas</div>
    </div>
  </div>

  <div class="leyenda">
    <span><span class="box libre"></span> Libre</span>
    <span><span class="box ocupada"></span> Ocupada</span>
    <span><span class="box bloqueada"></span> Bloqueada</span>
  </div>

  <div class="tablero" id="tablero"></div>

  <section class="panel-recaudacion">
    <div class="panel-header">
      <h2>Recaudación</h2>
      <div class="filtro-fechas">
        <input type="date" id="recaud-desde" title="Desde (fecha de entrada)">
        <span>—</span>
        <input type="date" id="recaud-hasta" title="Hasta (fecha de entrada)">
        <button class="btn secundario chico" id="btn-filtrar-recaudacion">Filtrar</button>
      </div>
    </div>
    <div class="recaud-resumen" id="recaud-resumen"></div>
    <div class="historico-lista" id="historico-lista"></div>
  </section>
</main>

<footer>Hotel Adaria Vera · Parking <span id="adaria-footer-version"></span></footer>

<!-- Modal plaza -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="cerrar" id="btn-cerrar">&times;</button>
    <div id="modal-contenido"></div>
  </div>
</div>

<!-- Modal tarifa -->
<div class="overlay" id="overlay-tarifa">
  <div class="modal">
    <button class="cerrar" id="btn-cerrar-tarifa">&times;</button>
    <h2>Tarifa del parking</h2>
    <div class="campo">
      <label>Precio por día (€)</label>
      <input type="number" id="input-tarifa" min="0" step="0.5">
    </div>
    <div class="acciones-modal">
      <button class="btn primario" id="btn-guardar-tarifa">Guardar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="/version-badge.js"></script>
</body>
</html>
