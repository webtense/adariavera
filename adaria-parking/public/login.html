<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Adaria Vera · Parking — Acceso</title>
  <style>
    :root {
      --azul: #1b5e75;
      --azul-oscuro: #123f4e;
      --fondo: #f4f6f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--fondo);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: 340px;
      max-width: 90vw;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
      border-top: 5px solid var(--azul);
    }
    .card h2 {
      margin: 0 0 20px;
      text-align: center;
      color: var(--azul);
      font-size: 20px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 12px;
      border: 1px solid #dbe3e6;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #eef1f6;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="password"]:focus { border-color: var(--azul); }
    button[type="submit"] {
      width: 100%;
      background: var(--azul);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button[type="submit"]:hover { background: var(--azul-oscuro); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      color: #c62828;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    .login-foot {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: #9aa0a6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Hotel Adaria Vera · Parking</h2>

    <form id="loginForm">
      <input type="text" id="username" name="username" placeholder="Usuario" autocomplete="username" required>
      <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>

    <div class="error-msg" id="errorMsg"></div>
    <div class="login-foot">Acceso restringido al personal del hotel</div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('errorMsg');
      err.textContent = '';
      err.style.display = 'none';
      const body = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      };
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await r.json();
        if (r.ok) {
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get('next') || '/';
        } else {
          err.textContent = data.error || 'Error de acceso';
          err.style.display = 'block';
        }
      } catch {
        err.textContent = 'Error de conexión con el servidor';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
